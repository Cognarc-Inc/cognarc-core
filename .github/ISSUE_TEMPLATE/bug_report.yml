name: Bug report
description: Something behaves differently from what the documentation or a guarantee says.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. If this is a security issue (cross-tenant access, modifying an append-only table, bypassing `SET ROLE`), please use private vulnerability reporting instead; see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you observed instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: A failing test under `tests/` is ideal. Otherwise, the smallest script or SQL that shows the problem.
      render: python
  - type: input
    id: version
    attributes:
      label: cognarc-core version or commit
      placeholder: "0.1.0 or a commit SHA"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "Python 3.12.6, PostgreSQL 16.4, SQLAlchemy 2.0.36, psycopg 3.2.3, macOS 15"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Tracebacks, PostgreSQL error messages, test output.
      render: text
