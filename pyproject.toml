[project]
name = "cognarc-core"
version = "0.1.0"
description = "Decision-record contract and PostgreSQL ledger primitives: tenant isolation with forced row-level security, idempotent writes and append-only audit tables"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Cognarc Inc." }]
requires-python = ">=3.12,<3.14"
keywords = [
    "audit",
    "audit-log",
    "append-only",
    "decision-records",
    "governance",
    "ledger",
    "multi-tenant",
    "postgresql",
    "row-level-security",
    "sqlalchemy",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0.36",
]

[project.urls]
Homepage = "https://github.com/Cognarc-Inc/cognarc-core"
Repository = "https://github.com/Cognarc-Inc/cognarc-core"
Issues = "https://github.com/Cognarc-Inc/cognarc-core/issues"
Changelog = "https://github.com/Cognarc-Inc/cognarc-core/blob/main/CHANGELOG.md"
Security = "https://github.com/Cognarc-Inc/cognarc-core/blob/main/SECURITY.md"

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cognarc_core"]

[tool.ruff]
target-version = "py312"
line-length = 110
src = ["src", "tests", "scripts"]
extend-exclude = ["dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
# RUF001–RUF003：中文全形標點在字串、docstring、註解中是刻意的。E501：中文在 ruff 算兩格寬。
ignore = ["RUF001", "RUF002", "RUF003", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["cognarc_core", "tests"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
extraPaths = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
xfail_strict = true
markers = [
    "db: 需要 Postgres（CORE_TEST_ADMIN_URL；scripts/dev_pg.sh 可起一個臨時實例）",
]
